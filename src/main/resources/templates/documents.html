<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7fb;
            color: #1f2937;
        }

        .page {
            width: min(100%, 960px);
            margin: 0 auto;
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            margin-bottom: 20px;
            padding: 24px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        h1, h2 {
            margin: 0 0 12px;
        }

        p {
            margin: 0 0 16px;
            color: #4b5563;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 0 0 8px;
            font-weight: 600;
        }

        input[type="file"],
        input[type="text"] {
            display: block;
            width: 100%;
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f9fafb;
            box-sizing: border-box;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            background: #2563eb;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            background: #475569;
        }

        button.danger {
            background: #dc2626;
        }

        button:hover {
            filter: brightness(0.95);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .message {
            margin-top: 16px;
            min-height: 24px;
            font-weight: 600;
        }

        .hint {
            margin-top: 12px;
            font-size: 0.92rem;
            color: #6b7280;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: end;
            flex-wrap: wrap;
        }

        .toolbar > div {
            flex: 1 1 280px;
        }

        .list {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 12px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #f8fafc;
        }

        .file-name {
            word-break: break-word;
            font-family: Consolas, Monaco, monospace;
        }

        .empty {
            padding: 16px;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            color: #64748b;
            background: #f8fafc;
        }

        .status {
            margin-bottom: 12px;
            min-height: 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Documents</h1>
            <p>Upload files, view the current bucket contents, and remove documents from storage.</p>

            <form id="uploadForm" action="/knowledgehub/documents/file/upload" method="post" enctype="multipart/form-data">
                <label for="file">Choose file</label>
                <input id="file" name="file" type="file" required>

                <div class="toolbar">
                    <div>
                        <label for="bucketName">Bucket name (optional)</label>
                        <input id="bucketName" name="bucketName" type="text" placeholder="Leave blank for the default bucket">
                    </div>
                    <button id="submitButton" type="submit">Upload file</button>
                </div>

                <div id="uploadMessage" class="message" aria-live="polite"></div>
            </form>

            <div class="hint">Uploads and list/delete actions use the <code>/documents/file/*</code> endpoints from <code>DocumentController</code>.</div>
        </section>

        <section class="card">
            <div class="toolbar" style="align-items: center;">
                <div>
                    <h2>Stored files</h2>
                    <p>Refresh the list after uploading or deleting a document.</p>
                </div>
                <button id="refreshButton" class="secondary" type="button">Refresh list</button>
            </div>

            <div id="listStatus" class="status" aria-live="polite"></div>
            <ul id="documentList" class="list"></ul>
        </section>
    </main>

    <script>
        const form = document.getElementById('uploadForm');
        const uploadMessage = document.getElementById('uploadMessage');
        const listStatus = document.getElementById('listStatus');
        const documentList = document.getElementById('documentList');
        const submitButton = document.getElementById('submitButton');
        const refreshButton = document.getElementById('refreshButton');
        const bucketNameInput = document.getElementById('bucketName');

        function buildRequestUrl(path) {
            const url = new URL(path, window.location.origin);
            const bucketName = bucketNameInput.value.trim();

            if (bucketName) {
                url.searchParams.set('bucketName', bucketName);
            }

            return url;
        }

        function setMessage(element, text, color) {
            element.textContent = text;
            element.style.color = color;
        }

        function renderDocuments(files) {
            documentList.innerHTML = '';

            if (!files.length) {
                const emptyState = document.createElement('li');
                emptyState.className = 'empty';
                emptyState.textContent = 'No documents found in the selected bucket.';
                documentList.appendChild(emptyState);
                return;
            }

            files.forEach((fileName) => {
                const item = document.createElement('li');
                item.className = 'list-item';

                const name = document.createElement('span');
                name.className = 'file-name';
                name.textContent = fileName;

                const actions = document.createElement('div');
                actions.className = 'actions';

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'danger';
                deleteButton.textContent = 'Delete';
                deleteButton.addEventListener('click', () => deleteDocument(fileName));

                actions.appendChild(deleteButton);
                item.appendChild(name);
                item.appendChild(actions);
                documentList.appendChild(item);
            });
        }

        async function loadDocuments() {
            listStatus.textContent = 'Loading documents...';

            try {
                const response = await fetch(buildRequestUrl('/knowledgehub/documents/file/list'));

                if (!response.ok) {
                    throw new Error('Failed to load document list');
                }

                const files = await response.json();
                renderDocuments(Array.isArray(files) ? files : []);
                setMessage(listStatus, `Loaded ${Array.isArray(files) ? files.length : 0} document(s).`, '#166534');
            } catch (error) {
                documentList.innerHTML = '';
                setMessage(listStatus, 'Unable to load documents.', '#b91c1c');
            }
        }

        async function deleteDocument(fileName) {
            if (!window.confirm(`Delete "${fileName}"?`)) {
                return;
            }

            try {
                setMessage(listStatus, `Deleting ${fileName}...`, '#475569');
                const response = await fetch(buildRequestUrl(`/knowledgehub/documents/file/delete/${encodeURIComponent(fileName)}`), {
                    method: 'GET'
                });

                if (!response.ok) {
                    throw new Error('Delete request failed');
                }

                await loadDocuments();
            } catch (error) {
                setMessage(listStatus, `Unable to delete ${fileName}.`, '#b91c1c');
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            uploadMessage.textContent = '';
            submitButton.disabled = true;

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form)
                });
                const text = await response.text();
                setMessage(uploadMessage, text, response.ok ? '#166534' : '#b91c1c');

                if (response.ok) {
                    form.querySelector('#file').value = '';
                    await loadDocuments();
                }
            } catch (error) {
                setMessage(uploadMessage, 'Upload failed. Please try again.', '#b91c1c');
            } finally {
                submitButton.disabled = false;
            }
        });

        refreshButton.addEventListener('click', loadDocuments);
        bucketNameInput.addEventListener('change', loadDocuments);
        loadDocuments();
    </script>
</body>
</html>
